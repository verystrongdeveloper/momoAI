<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">MomoStory 캐릭터 대화 예시</title>
  <desc id="desc">호시노와 선생의 예시 대화가 표시된 MomoStory 채팅 화면</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop stop-color="#fb94a7"/><stop offset="1" stop-color="#f5b1bd"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#172033" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1440" height="900" fill="#f7f8fb"/>
  <rect width="1440" height="72" fill="url(#header)"/>
  <text x="34" y="45" fill="white" font-family="Arial, sans-serif" font-size="25" font-weight="700">MomoStory</text>
  <rect y="72" width="74" height="828" fill="#344054"/>
  <text x="25" y="135" fill="#fff" font-family="Arial, sans-serif" font-size="29">♙</text>
  <text x="23" y="208" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="28">▥</text>
  <text x="23" y="281" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="27">⚙</text>
  <rect x="74" y="72" width="350" height="828" fill="#f2f5f8"/>
  <text x="105" y="125" fill="#1e293b" font-family="Arial, sans-serif" font-size="17" font-weight="700">캐릭터</text>
  <rect x="93" y="149" width="312" height="92" rx="14" fill="#fff" filter="url(#shadow)"/>
  <circle cx="140" cy="195" r="31" fill="#f7cad4"/>
  <text x="126" y="204" fill="#9f1239" font-family="Arial, sans-serif" font-size="22" font-weight="700">호</text>
  <text x="190" y="187" fill="#182230" font-family="Arial, sans-serif" font-size="18" font-weight="700">호시노</text>
  <text x="190" y="213" fill="#64748b" font-family="Arial, sans-serif" font-size="14">낮잠 중 방해금지</text>
  <rect x="93" y="255" width="312" height="76" rx="14" fill="#f8fafc"/>
  <circle cx="140" cy="293" r="25" fill="#ddd6fe"/>
  <text x="130" y="301" fill="#6d28d9" font-family="Arial, sans-serif" font-size="17" font-weight="700">히</text>
  <text x="180" y="299" fill="#475569" font-family="Arial, sans-serif" font-size="16">히나</text>
  <rect x="424" y="72" width="1016" height="828" fill="#fff"/>
  <rect x="424" y="72" width="1016" height="88" fill="#fff"/>
  <line x1="424" y1="160" x2="1440" y2="160" stroke="#e5e7eb"/>
  <circle cx="475" cy="116" r="25" fill="#f7cad4"/>
  <text x="464" y="124" fill="#9f1239" font-family="Arial, sans-serif" font-size="18" font-weight="700">호</text>
  <text x="520" y="111" fill="#182230" font-family="Arial, sans-serif" font-size="20" font-weight="700">호시노</text>
  <text x="520" y="136" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">대책위원회</text>
  <text x="476" y="209" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">오늘</text>
  <rect x="475" y="235" width="414" height="76" rx="19" fill="#f1f5f9"/>
  <text x="501" y="267" fill="#334155" font-family="Arial, sans-serif" font-size="18">으헤~ 선생, 오늘도 왔구나.</text>
  <text x="501" y="292" fill="#334155" font-family="Arial, sans-serif" font-size="18">아저씨는 지금 막 쉬려던 참이었는데.</text>
  <rect x="955" y="341" width="372" height="52" rx="19" fill="#fb94a7"/>
  <text x="982" y="374" fill="white" font-family="Arial, sans-serif" font-size="18">그럼 같이 잠깐 쉬어도 될까?</text>
  <rect x="475" y="425" width="456" height="76" rx="19" fill="#f1f5f9"/>
  <text x="501" y="457" fill="#334155" font-family="Arial, sans-serif" font-size="18">좋지. 따뜻한 음료도 하나 챙겨 와.</text>
  <text x="501" y="482" fill="#334155" font-family="Arial, sans-serif" font-size="18">오늘은 느긋하게 이야기하자고.</text>
  <rect x="424" y="770" width="1016" height="130" fill="#f8fafc"/>
  <rect x="462" y="799" width="844" height="56" rx="18" fill="#fff" stroke="#d8dee8" stroke-width="2"/>
  <text x="490" y="834" fill="#94a3b8" font-family="Arial, sans-serif" font-size="17">메시지를 입력하세요</text>
  <circle cx="1352" cy="827" r="29" fill="#fb94a7"/>
  <text x="1342" y="836" fill="white" font-family="Arial, sans-serif" font-size="21">➜</text>
  <rect x="1137" y="184" width="230" height="31" rx="15" fill="#fff1f4"/>
  <text x="1160" y="205" fill="#be123c" font-family="Arial, sans-serif" font-size="14" font-weight="700">README 예시 대화</text>
</svg>
