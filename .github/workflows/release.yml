name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build
      - name: Collect Windows files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-out | Out-Null
          Copy-Item src-tauri/target/release/momostory.exe release-out/MomoStory.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release-out/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release-out/*

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - run: npm ci
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk MomoStory.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: MomoStory.apk

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export web
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_GEMINI_TRANSPORT: direct
      - name: Zip web
        run: zip -r momo-web.zip dist
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: momo-web.zip

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/*
            release-assets/android/*
            release-assets/web/*
          body: |
            ## MomoStory ${{ github.ref_name }}

            - Windows: `MomoStory.exe` 또는 설치 파일
            - Android: `MomoStory.apk`
            - 웹: `momo-web.zip`

            Gemini 키는 들어 있지 않습니다. 설치한 뒤 설정에서 본인 키를 입력하세요.
